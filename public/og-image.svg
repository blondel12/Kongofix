<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#1e3a5f" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle pattern overlay -->
  <g opacity="0.06">
    <circle cx="100" cy="100" r="200" fill="white"/>
    <circle cx="1100" cy="530" r="250" fill="white"/>
    <circle cx="600" cy="700" r="350" fill="white"/>
  </g>

  <!-- White card -->
  <rect x="140" y="140" width="920" height="350" rx="24" fill="url(#cardGrad)" filter="url(#shadow)"/>

  <!-- Logo area: wrench icon + brand -->
  <!-- Wrench icon circle -->
  <rect x="340" y="205" width="110" height="110" rx="24" fill="url(#bgGrad)"/>
  <text x="395" y="282" text-anchor="middle" font-size="54" fill="white">🔧</text>

  <!-- KongoFix brand name -->
  <text x="465" y="280" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#1e293b" letter-spacing="-1">Kongo</text>
  <text x="642" y="280" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#2563eb" letter-spacing="-1">Fix</text>

  <!-- Divider line -->
  <line x1="200" y1="340" x2="1000" y2="340" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Main headline -->
  <text x="600" y="390" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#1e293b">
    Services techniques à domicile en République du Congo
  </text>

  <!-- Subtitle -->
  <text x="600" y="430" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" fill="#64748b">
    Trouvez un technicien qualifié près de chez vous
  </text>

  <!-- Bottom accent bar -->
  <rect x="500" y="465" width="200" height="4" rx="2" fill="#2563eb"/>

  <!-- Bottom URL -->
  <text x="600" y="590" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="rgba(255,255,255,0.7)">
    kongofix.com
  </text>
</svg>
