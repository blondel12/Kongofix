  </g>
  
  <!-- KongoFix text -->
  <text x="125" y="52" font-family="'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="800" fill="#1e293b" letter-spacing="-0.5">Kongo</text>
  <text x="232" y="52" font-family="'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="800" fill="#2563eb" letter-spacing="-0.5">Fix</text>
  
  <!-- Tagline -->
  <text x="127" y="76" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#64748b" letter-spacing="0.5">SERVICES TECHNIQUES À DOMICILE</text>
